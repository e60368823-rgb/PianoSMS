name: Build Piano SMS APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

concurrency:
  group: piano-sms-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Verify private Bale build settings
        env:
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          BALE_CHAT_ID: ${{ secrets.BALE_CHAT_ID }}
        run: |
          test -n "$BALE_BOT_TOKEN" || (echo "Missing repository secret BALE_BOT_TOKEN" && exit 1)
          test -n "$BALE_CHAT_ID" || (echo "Missing repository secret BALE_CHAT_ID" && exit 1)
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Download CC0 sampled piano notes
        run: |
          mkdir -p app/src/main/res/raw
          BASE="https://raw.githubusercontent.com/facebookincubator/Meta-open-sound/main/systems/instruments/meta-piano/ogg"
          curl -fLsS "$BASE/INSPiano_Vel03_C4_01.ogg" -o app/src/main/res/raw/piano_c4.ogg
          curl -fLsS "$BASE/INSPiano_Vel03_D4_01.ogg" -o app/src/main/res/raw/piano_d4.ogg
          curl -fLsS "$BASE/INSPiano_Vel03_E4_01.ogg" -o app/src/main/res/raw/piano_e4.ogg
          curl -fLsS "$BASE/INSPiano_Vel03_F4_01.ogg" -o app/src/main/res/raw/piano_f4.ogg
          curl -fLsS "$BASE/INSPiano_Vel03_G4_01.ogg" -o app/src/main/res/raw/piano_g4.ogg
          curl -fLsS "$BASE/INSPiano_Vel03_A4_01.ogg" -o app/src/main/res/raw/piano_a4.ogg
          curl -fLsS "$BASE/INSPiano_Vel03_B4_01.ogg" -o app/src/main/res/raw/piano_b4.ogg
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        env:
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          BALE_CHAT_ID: ${{ secrets.BALE_CHAT_ID }}
        run: gradle --no-daemon assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PianoSMS-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
